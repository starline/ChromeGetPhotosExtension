<!-- @version 0.4 -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GetPhotos</title>
    <link rel="stylesheet" href="../assets/popup.css" />
</head>
<body>
    <main class="popup">
        <h1 class="title">GetPhotos</h1>
        <button id="openDialog" class="primary">Открыть диалог</button>

        <dialog id="controlsDialog" aria-labelledby="dialogTitle" aria-modal="true">
            <div class="dialog__header">
                <h2 id="dialogTitle" class="dialog__title">Фильтры изображений</h2>
                <button id="closeDialog" class="ghost" aria-label="Закрыть">×</button>
            </div>
            <div class="dialog__body">
                <div class="actions">
                    <label class="field">
                        <span class="field__label">Минимальная ширина</span>
                        <input type="number" id="minWidth" class="field__input" min="0" placeholder="например, 800" />
                    </label>
                    <button id="collectImages" class="primary">Получить изображения</button>
                </div>
                <div class="results" aria-live="polite">
                    <p id="imageCount" class="results__count hidden"></p>
                    <p id="emptyState">Список изображений появится здесь.</p>
                    <ul id="imageList" class="hidden"></ul>
                </div>
            </div>
        </dialog>
    </main>
    <script src="../src/popup.js" defer></script>
</body>
</html>
